<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVGen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════
       ÉCRAN 1 : NON CONNECTÉ
  ═══════════════════════════════════════════════════════ -->
  <div id="screen-login" class="screen" style="display:none">
    <div class="screen-header">
      <div class="logo-mark">CV</div>
      <h1 class="logo-text">CVGen</h1>
      <p class="logo-sub">Autofill intelligent de candidatures</p>
    </div>

    <form id="login-form" class="form-box" novalidate>
      <div class="form-group">
        <label for="input-email" class="form-label">Adresse email</label>
        <input
          id="input-email"
          type="email"
          class="form-input"
          placeholder="vous@exemple.fr"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="input-password" class="form-label">Mot de passe</label>
        <div class="input-password-wrap">
          <input
            id="input-password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" id="toggle-password" class="toggle-pwd" aria-label="Afficher le mot de passe">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="login-error" class="alert alert-error" style="display:none" role="alert"></div>

      <button type="submit" id="btn-login" class="btn btn-primary btn-full">
        <span id="btn-login-text">Se connecter</span>
        <span id="btn-login-spinner" class="spinner" style="display:none"></span>
      </button>
    </form>

    <div class="divider"></div>

    <p class="footer-link-text">
      Pas encore de compte ?
      <a href="#" id="link-register" class="link">Créer un compte</a>
    </p>
  </div>

  <!-- ════════════════════════════════════════════════════
       ÉCRAN 2 : CONNECTÉ
  ═══════════════════════════════════════════════════════ -->
  <div id="screen-connected" class="screen" style="display:none">

    <!-- En-tête utilisateur -->
    <div class="user-header">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <span class="user-name" id="user-name">—</span>
        <span class="user-email" id="user-email">—</span>
      </div>
    </div>

    <!-- Statut sync profil -->
    <div class="sync-badge" id="sync-badge">
      <span class="sync-dot sync-dot--ok"></span>
      <span id="sync-label">Profil synchronisé</span>
    </div>

    <!-- Indicateur site courant -->
    <div class="site-indicator" id="site-indicator">
      <span class="site-icon">🌐</span>
      <span id="site-name">Détection en cours…</span>
    </div>

    <!-- Champs détectés -->
    <details class="fields-panel" id="fields-panel">
      <summary class="fields-summary">
        Champs détectés
        <span class="fields-count badge" id="fields-count">0</span>
      </summary>
      <ul class="fields-list" id="fields-list">
        <li class="fields-empty">Aucun champ CVGen détecté sur cette page.</li>
      </ul>
    </details>

    <!-- Message lettre de motivation -->
    <div id="cover-letter-hint" class="alert alert-info" style="display:none">
      💡 <strong>Lettre de motivation</strong> non disponible.
      <a href="#" id="link-generate-cover" class="link">Générer sur CVGen →</a>
    </div>

    <!-- Action principale -->
    <button id="btn-fill" class="btn btn-primary btn-full" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span id="btn-fill-text">Remplir le formulaire</span>
      <span id="btn-fill-spinner" class="spinner" style="display:none"></span>
    </button>

    <!-- Résultat du remplissage -->
    <div id="fill-result" class="fill-result" style="display:none"></div>

    <!-- Actions secondaires -->
    <div class="actions-secondary">
      <button id="btn-sync" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Actualiser le profil
      </button>

      <button id="btn-options" class="btn btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
            a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
            A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
            l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
            A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
            l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
            a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
            l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
            a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Options
      </button>
    </div>

    <div class="divider"></div>

    <button id="btn-logout" class="btn-logout">Déconnexion</button>

  </div>

  <!-- ════════════════════════════════════════════════════
       ÉCRAN CHARGEMENT INITIAL
  ═══════════════════════════════════════════════════════ -->
  <div id="screen-loading" class="screen screen-center">
    <div class="spinner spinner-lg"></div>
    <p class="loading-text">Chargement…</p>
  </div>

  <script src="../utils/logger.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
