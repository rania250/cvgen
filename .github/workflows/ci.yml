name: CVGen CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # =====================================================
  # Backend : Spring Boot + PostgreSQL (service container)
  # =====================================================
  backend-ci:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cvgen-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cvgen_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cvgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & verify
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cvgen_test
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: test_secret_key_minimum_32_characters_ok

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: cvgen-backend-jar
          path: cvgen-backend/target/*.jar
          if-no-files-found: warn
          retention-days: 7

  # =====================================================
  # Frontend : Vite / React / TypeScript
  # =====================================================
  frontend-ci:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cvgen-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cvgen-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: cvgen-frontend-dist
          path: cvgen-frontend/dist
          if-no-files-found: error
          retention-days: 7
