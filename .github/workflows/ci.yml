name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------
  # Backend : build & tests Maven
  # ----------------------------------------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cvgen-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test
        run: mvn -B clean verify
        if: ${{ hashFiles('cvgen-backend/pom.xml') != '' }}

  # ----------------------------------------
  # Frontend : build & lint Vite/React
  # ----------------------------------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cvgen-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cvgen-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        if: ${{ hashFiles('cvgen-frontend/package-lock.json') != '' }}

      - name: Lint
        run: npm run lint --if-present
        if: ${{ hashFiles('cvgen-frontend/package.json') != '' }}

      - name: Build
        run: npm run build --if-present
        if: ${{ hashFiles('cvgen-frontend/package.json') != '' }}
